name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p .pages-output/assets/css .pages-output/assets/js .pages-output/assets/img
          cp ./*.html ./_headers .pages-output/
          cp ./assets/css/*.css .pages-output/assets/css/
          cp ./assets/js/*.js .pages-output/assets/js/
          cp ./assets/img/*.jpg .pages-output/assets/img/

      - name: Deploy to Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy .pages-output
          --project-name=apexsynthesis
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
